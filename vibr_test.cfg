# klipper-vibr-report: vibrations by toolhead speed -> HTML/CSV report with slicer speed advice.
# https://github.com/GNUGiminot/klipper-vibr-report  (GPL-3.0)
# Motion pattern ported from Klippain ShakeTune v2.6.1 VIBRATIONS_CALIBRATION (Frix-x, GPL-3.0).
# Works without ShakeTune. ASCII only: stock QIDI Klipper runs on Python 2.7.
#
# Usage (Fluidd/Mainsail console):  VIBR_TEST
#   PASSES=2 MIN_SPEED=30 MAX_SPEED=300 SPEED_INCREMENT=5 ACCEL=5000 SIZE=80 Z_HEIGHT=20 TRAVEL_SPEED=300 CHIP=<name>
#   PASSES: full sweeps; the report averages them (each pass normalised to its own maximum).
# Results: <config folder>/vibr_report_results/

[gcode_shell_command vibr_report]
command: ~/klipper-vibr-report/vibr_report.sh
timeout: 300.
verbose: True

[gcode_macro VIBR_TEST]
description: Vibrations by speed -> report (HTML/CSV) with slicer speed advice
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    # rendered after homing, so the homed check below sees the real state
    _VIBR_RUN {rawparams}

[gcode_macro _VIBR_RUN]
gcode:
    {% set passes = [params.PASSES|default(2)|int, 1]|max %}
    {% set min_speed = params.MIN_SPEED|default(30)|float %}
    {% set max_speed = params.MAX_SPEED|default(300)|float %}
    {% set inc = params.SPEED_INCREMENT|default(5)|float %}
    {% set size = params.SIZE|default(80)|float %}
    {% set z_height = params.Z_HEIGHT|default(20)|float %}
    {% set travel = params.TRAVEL_SPEED|default(300)|float * 60 %}
    {% set accel = [params.ACCEL|default(5000)|int, printer.configfile.settings.printer.max_accel|int]|min %}
    {% set chip = params.CHIP|default('') %}
    {% set chip_arg = ('CHIP=' ~ chip) if chip else '' %}
    {% set mid_x = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set mid_y = printer.toolhead.axis_maximum.y|float / 2 %}
    {% set n = ((max_speed - min_speed) / inc + 1)|int %}
    {% set th = printer.toolhead %}
    {% set new_klipper = th.minimum_cruise_ratio is defined %}

    {% if 'xyz' not in th.homed_axes %}
        { action_raise_error("VIBR_TEST: home the printer first (G28)") }
    {% endif %}
    {% if size / max_speed < 0.25 %}
        { action_raise_error("VIBR_TEST: SIZE is too small for this MAX_SPEED") }
    {% endif %}

    RESPOND MSG="VIBR_TEST: {passes} pass(es) x {n} speeds {min_speed|int}-{max_speed|int} mm/s, accel {accel}. Do not touch the printer."
    SAVE_GCODE_STATE NAME=VIBR_TEST_STATE
    G90
    # constant speed on the straight segments: no cruise limiting
    {% if new_klipper %}
    SET_VELOCITY_LIMIT ACCEL={accel} MINIMUM_CRUISE_RATIO=0 SQUARE_CORNER_VELOCITY={[accel / 1000, 5.0]|max}
    {% else %}
    SET_VELOCITY_LIMIT ACCEL={accel} ACCEL_TO_DECEL={accel} SQUARE_CORNER_VELOCITY={[accel / 1000, 5.0]|max}
    {% endif %}
    G1 Z{z_height} F{travel / 10}
    G1 X{mid_x - size / 2} Y{mid_y - size / 2} F{travel}

    {% for k in range(1, passes + 1) %}
    {% for i in range(n) %}
        {% set v = min_speed + i * inc %}
        RESPOND MSG="VIBR_TEST: pass {k}/{passes}, {'%.1f' % v} mm/s"
        ACCELEROMETER_MEASURE {chip_arg}
        G1 X{mid_x + size / 2} Y{mid_y - size / 2} F{v * 60}
        G1 X{mid_x + size / 2} Y{mid_y + size / 2} F{v * 60}
        G1 X{mid_x - size / 2} Y{mid_y + size / 2} F{v * 60}
        G1 X{mid_x - size / 2} Y{mid_y - size / 2} F{v * 60}
        ACCELEROMETER_MEASURE {chip_arg} NAME=vibr_sp{('%.2f' % v)|replace('.', '_')}_p{k}
        G4 P300
        M400
    {% endfor %}
    {% endfor %}

    {% if new_klipper %}
    SET_VELOCITY_LIMIT ACCEL={th.max_accel} MINIMUM_CRUISE_RATIO={th.minimum_cruise_ratio} SQUARE_CORNER_VELOCITY={th.square_corner_velocity}
    {% else %}
    SET_VELOCITY_LIMIT ACCEL={th.max_accel} ACCEL_TO_DECEL={th.max_accel_to_decel} SQUARE_CORNER_VELOCITY={th.square_corner_velocity}
    {% endif %}
    RESTORE_GCODE_STATE NAME=VIBR_TEST_STATE
    # let Klipper finish writing the last CSV file
    G4 P2000
    RUN_SHELL_COMMAND CMD=vibr_report PARAMS="--accel {accel}"
    RESPOND MSG="VIBR_TEST: done. Download the report from the config folder: vibr_report_results"
